<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline — Kitchen & Baking Converter</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: #fdf6ec; color: #43302b;
      padding: 1.5rem; text-align: center;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #2a2320; color: #f3e9dd; }
    }
    .card { max-width: 26rem; }
    .cup {
      width: 72px; height: 72px; margin: 0 auto 1rem;
      border-radius: 20px; background: #bc5a2e;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem;
    }
    h1 { font-size: 1.35rem; margin-bottom: .5rem; }
    p { line-height: 1.6; opacity: .8; font-size: .95rem; }
    button {
      margin-top: 1.25rem; padding: .7rem 1.5rem;
      border: 0; border-radius: 999px; cursor: pointer;
      background: #bc5a2e; color: #fff;
      font-size: .95rem; font-weight: 600;
    }
    button:hover { background: #a64c26; }
  </style>
</head>
<body>
  <main class="card">
    <div class="cup">&#127869;&#65039;</div>
    <h1>You're offline</h1>
    <p>
      Kitchen &amp; Baking Converter needs a connection the first time it loads.
      Reopen this page once you're back online — your saved conversions are kept on this device.
    </p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
